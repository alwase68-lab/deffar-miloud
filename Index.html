<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deffar Miloud | معرض الأعمال الفنية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
      line-height: 1.7;
    }

    header {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url("https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
    }

    header h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    header p {
      font-size: 21px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      background: #d49a3a;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    section {
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .about {
      text-align: center;
      max-width: 750px;
      margin: auto;
      font-size: 18px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
      transition: .3s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }
